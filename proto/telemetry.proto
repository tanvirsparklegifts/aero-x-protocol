
syntax = "proto3";

package aero.v1;

option go_package = "aero-x-protocol/proto/v1;aerov1";

// QoS Priority Levels for Telemetry & Command Routing
enum QoSPriority {
  QOS_UNSPECIFIED = 0;
  QOS_BEST_EFFORT = 1;
  QOS_RELIABLE = 2;
  QOS_MISSION_CRITICAL = 3;
}

// TelemetryPacket defines the structured message payload for Nexus Data Fabric
message TelemetryPacket {
  string agent_id = 1;
  double latitude = 2;
  double longitude = 3;
  double altitude = 4;
  double velocity = 5;
  int64 timestamp_epoch_ms = 6;
  QoSPriority priority = 7;
}

// HeartbeatResponse returns swarm synchronization feedback
message HeartbeatResponse {
  bool acknowledged = 1;
  int64 server_timestamp_epoch_ms = 2;
  string swarm_status = 3;
}

// NexusTransportService defines high-throughput gRPC communication contract
service NexusTransportService {
  rpc StreamTelemetry (stream TelemetryPacket) returns (HeartbeatResponse);
}
