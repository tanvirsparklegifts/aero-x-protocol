syntax = "proto3";

package aerox.telemetry.v1;

enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  VEHICLE_TYPE_COMMERCIAL_AIRCRAFT = 1;
  VEHICLE_TYPE_HELICOPTER = 2;
  VEHICLE_TYPE_HIGH_SPEED_TRAIN = 3;
  VEHICLE_TYPE_ORBITAL_ROCKET = 4;
}

message Vector3D {
  double x = 1;
  double y = 2;
  double z = 3;
}

message VehicleState {
  string vehicle_id = 1;
  VehicleType type = 2;
  Vector3D position = 3;
  Vector3D velocity = 4;
  Vector3D acceleration = 5;
  double fuel_or_battery_level = 6;
  uint64 timestamp_utc_ms = 7;
}

message AgentOrchestrationCommand {
  string source_agent_id = 1;
  string target_vehicle_id = 2;
  Vector3D trajectory_adjustment = 3;
  bool emergency_override = 4;
  string rationale = 5;
}
