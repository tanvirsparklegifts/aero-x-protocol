<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <title>AERO-X Protocol System Architecture</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4385FF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102735"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#152642"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="violetPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#261D3D"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#background)"/>

  <!-- HEADER -->
  <rect x="30" y="25" width="1540" height="112" rx="18" fill="url(#headerGlow)" stroke="#1D344C"/>
  <text x="60" y="69" fill="#EAF2FF" font-size="35" font-weight="800" font-family="Inter, Arial, sans-serif" letter-spacing="3">AERO-X PROTOCOL</text>
  <text x="62" y="99" fill="#8FA3BF" font-size="14" font-family="Inter, Arial, sans-serif" letter-spacing="2">AUTONOMOUS AEROSPACE &amp; MULTI-VEHICLE ORCHESTRATION ENGINE</text>

  <!-- LAYER 01 -->
  <rect x="40" y="160" width="1520" height="172" rx="16" fill="#0C1422" stroke="#00E5FF" stroke-width="1.3"/>
  <text x="62" y="187" fill="#00E5FF" font-size="12" font-weight="800" font-family="Inter, Arial, sans-serif">LAYER 01: EDGE-NATIVE PERCEPTION &amp; VEHICLE INTELLIGENCE</text>

  <!-- LAYER 02 -->
  <rect x="40" y="350" width="1520" height="202" rx="16" fill="#0C1422" stroke="#4385FF" stroke-width="1.3"/>
  <text x="62" y="377" fill="#4385FF" font-size="12" font-weight="800" font-family="Inter, Arial, sans-serif">LAYER 02: MULTI-AGENT INTELLIGENCE &amp; ORCHESTRATION (SWARM CORE)</text>

  <!-- LAYER 03 -->
  <rect x="40" y="570" width="1520" height="180" rx="16" fill="#0C1422" stroke="#00E5FF" stroke-width="1.3"/>
  <text x="62" y="597" fill="#00E5FF" font-size="12" font-weight="800" font-family="Inter, Arial, sans-serif">LAYER 03: DETERMINISTIC COMMUNICATION &amp; DATA FABRIC (NEXUS FABRIC)</text>

  <!-- LAYER 04 -->
  <rect x="40" y="770" width="1520" height="170" rx="16" fill="#0C1422" stroke="#A78BFA" stroke-width="1.3"/>
  <text x="62" y="797" fill="#A78BFA" font-size="12" font-weight="800" font-family="Inter, Arial, sans-serif">LAYER 04: DIGITAL TWIN &amp; SIMULATION INTELLIGENCE</text>

  <!-- SAFETY PLANE -->
  <rect x="40" y="958" width="1520" height="62" rx="13" fill="#101E20" stroke="#42F5B3" stroke-width="1.4"/>
  <text x="94" y="995" fill="#42F5B3" font-size="15" font-weight="800" font-family="Inter, Arial, sans-serif">CROSS-LAYER SAFETY &amp; OBSERVABILITY PLANE</text>
</svg>
